name: Build signed App Store IPA
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number
        required: true
        default: '1'
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      TEAM_ID: 4RBXVT9Q86
      PROFILE_NAME: OrunVoca App Store
    steps:
      - uses: actions/checkout@v4
      - name: Validate build number
        run: '[[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]'
      - name: Install signing assets into temporary keychain
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD" && test -n "$PROFILE_BASE64"
          KEYCHAIN_PATH="$RUNNER_TEMP/orunvoca-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/voca.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/voca.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")" = "$PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")" = "$TEAM_ID.com.orunvoca.app"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/voca.mobileprovision" "$dir/$UUID.mobileprovision"
          done
      - name: Archive iPhone and iPad release
        run: |
          set -euo pipefail
          mkdir -p native/ios/build
          xcodebuild -project native/ios/OrunVoca.xcodeproj -scheme OrunVoca \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/native/ios/build/OrunVoca.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive 2>&1 | tee native/ios/build/archive.log
      - name: Export App Store IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>stripSwiftSymbols</key><true/>
          <key>provisioningProfiles</key><dict><key>com.orunvoca.app</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/native/ios/build/OrunVoca.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$PWD/native/ios/build/export" 2>&1 | tee native/ios/build/export.log
          codesign --verify --deep --strict native/ios/build/OrunVoca.xcarchive/Products/Applications/OrunVoca.app
          test -n "$(find native/ios/build/export -name '*.ipa' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: OrunVoca-AppStore-build-${{ inputs.build_number }}
          path: native/ios/build/export/*.ipa
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OrunVoca-signing-build-logs
          path: native/ios/build/*.log
          retention-days: 7
      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/orunvoca-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/voca.mobileprovision" "$RUNNER_TEMP/profile.plist"
