name: iOS runtime smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-smoke:
    name: Native runtime (${{ matrix.device }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # iPhone cold launch is intermittently unresponsive on the 7GB arm64 host.
          # The official standard Intel image has Xcode 26.3 and iOS 26.2 installed.
          - device: iphone
            runner: macos-15-intel
            developer: /Applications/Xcode_26.3.app/Contents/Developer
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-2
          # Keep the independently passing iPad configuration unchanged.
          - device: ipad
            runner: macos-latest
            developer: /Applications/Xcode.app/Contents/Developer
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-4
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      SMOKE_RUNTIME_IDENTIFIER: ${{ matrix.runtime }}
      SMOKE_PREPARE_FOR_XCTEST: "1"
      SMOKE_DEVICE_FAMILY: ${{ matrix.device }}
      SMOKE_OUTPUT_DIR: runtime-smoke/${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
      - name: Build app and XCTest runner without starting a simulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_OUTPUT_DIR"
          xcodebuild -version | tee "$SMOKE_OUTPUT_DIR/xcode-version.log"
          sw_vers | tee "$SMOKE_OUTPUT_DIR/runner-version.log"
          xcodebuild -project native/ios/OrunVoca.xcodeproj -scheme OrunVocaSmoke \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath native/ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing \
            2>&1 | tee "$SMOKE_OUTPUT_DIR/build-for-testing.log"
          ditto -c -k --sequesterRsrc --keepParent \
            native/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/OrunVoca.app \
            "$SMOKE_OUTPUT_DIR/OrunVoca-simulator.zip"
      - name: Prepare only selected device for mandatory XCTest
        id: simulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          node native/ios/scripts/runtime-smoke.mjs 2>&1 | tee "$SMOKE_OUTPUT_DIR/launch.log"
      - name: Native exact-count multi-card review and persistence UI regression
        # Separate from compilation and 480-second cold boot. Prior XCTest itself took 116s,
        # while total xcode test work took 255s before build; six minutes was not safe.
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # Fresh simulator-only sandbox: never a user's notebook or an authenticated session.
          # The hosted simulator is fresh; XCTest installs and cold-launches the app.
          # The test asserts an empty notebook, so stale app data cannot silently pass.
          xcodebuild -project native/ios/OrunVoca.xcodeproj -scheme OrunVocaSmoke \
            -configuration Debug -destination "platform=iOS Simulator,id=$SMOKE_UDID" \
            -destination-timeout 60 -derivedDataPath native/ios/build/DerivedData \
            -resultBundlePath "$SMOKE_OUTPUT_DIR/NativeSmoke.xcresult" \
            -only-testing:OrunVocaUITests/RuntimeSmokeTests/testEmptyNotebookAddRevealReview \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test-without-building \
            2>&1 | tee "$SMOKE_OUTPUT_DIR/ui-tests.log"
      - name: Export per-device XCTest screenshots and final simulator state
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_OUTPUT_DIR"
          # Nonessential evidence only: CoreSimulator list can hang after a good boot.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const output = process.env.SMOKE_OUTPUT_DIR + '/final-booted-state.json';
          try {
            fs.writeFileSync(output, execFileSync('xcrun', ['simctl', 'list', 'devices', 'booted', '--json'],
              { timeout: 10000, killSignal: 'SIGKILL', encoding: 'utf8' }));
          } catch (error) {
            console.warn('Nonfatal final-state diagnostic: ' + error);
            fs.writeFileSync(output + '.error.log', String(error));
          }
          JS
          if [ -d "$SMOKE_OUTPUT_DIR/NativeSmoke.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$SMOKE_OUTPUT_DIR/NativeSmoke.xcresult" \
              --output-path "$SMOKE_OUTPUT_DIR/test-attachments" \
              2>&1 | tee "$SMOKE_OUTPUT_DIR/attachment-export.log"
          fi
      - name: Upload per-device screenshots logs app and XCTest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrunVoca-runtime-smoke-${{ matrix.device }}
          path: runtime-smoke/${{ matrix.device }}/
          if-no-files-found: error
          retention-days: 14
