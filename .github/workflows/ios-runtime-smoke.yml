name: iOS runtime smoke
# iOS Simulator on GitHub-hosted macOS VMs. NOT a physical device and NOT a distributable build:
# the app is compiled with the test-only QA_SMOKE flag. Never signed, archived or submitted.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-smoke:
    name: Simulator runtime QA_SMOKE (${{ matrix.device }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # iPhone cold launch is intermittently unresponsive on the 7GB arm64 host.
          # The official standard Intel image has Xcode 26.3 and iOS 26.2 installed.
          - device: iphone
            runner: macos-15-intel
            developer: /Applications/Xcode_26.3.app/Contents/Developer
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-2
          # Keep the independently passing iPad configuration unchanged.
          - device: ipad
            runner: macos-latest
            developer: /Applications/Xcode.app/Contents/Developer
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-4
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
      SMOKE_RUNTIME_IDENTIFIER: ${{ matrix.runtime }}
      SMOKE_PREPARE_FOR_XCTEST: "1"
      SMOKE_DEVICE_FAMILY: ${{ matrix.device }}
      SMOKE_OUTPUT_DIR: runtime-smoke/${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
      - name: Build QA_SMOKE test-only app and XCTest runner without starting a simulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_OUTPUT_DIR"
          xcodebuild -version | tee "$SMOKE_OUTPUT_DIR/xcode-version.log"
          sw_vers | tee "$SMOKE_OUTPUT_DIR/runner-version.log"
          xcodebuild -project native/ios/OrunVoca.xcodeproj -scheme OrunVocaSmoke \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath native/ios/build/DerivedData \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) QA_SMOKE' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing \
            2>&1 | tee "$SMOKE_OUTPUT_DIR/build-for-testing.log"
          APP=native/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/OrunVoca.app
          # Prove the flag took effect (fixture compiled in); this binary is test-only.
          MARKED="$(grep -r -a -l 'orun-qa-smoke' "$APP" || true)"
          test -n "$MARKED" || { echo "QA_SMOKE fixture missing from test build"; exit 1; }
          { echo "flavor=QA_SMOKE (TEST ONLY, simulator, unsigned, never distribute)"
            echo "fixture_in=$MARKED"
            find "$APP" -type f \( -name OrunVoca -o -name '*.dylib' \) -exec shasum -a 256 {} \;
          } | tee "$SMOKE_OUTPUT_DIR/build-flavor.txt"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "$SMOKE_OUTPUT_DIR/OrunVoca-QA_SMOKE-simulator-TEST-ONLY.zip"
      - name: Prepare only selected device for mandatory XCTest
        id: simulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          node native/ios/scripts/runtime-smoke.mjs 2>&1 | tee "$SMOKE_OUTPUT_DIR/launch.log"
      - name: Online launch without tabs and native pronunciation bridge completion
        # Separate from compilation and 480-second cold boot. Two UI tests in one runner.
        # Pronunciation: real XCTest tap -> trusted DOM click -> native gesture gate ->
        # AVSpeechSynthesizer didFinish. A missing en-US voice fails with the exact native error.
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # Fresh simulator-only sandbox: never an authenticated session. Public login page only;
          # the tests never type into, submit, create, save or delete site data.
          xcodebuild -project native/ios/OrunVoca.xcodeproj -scheme OrunVocaSmoke \
            -configuration Debug -destination "platform=iOS Simulator,id=$SMOKE_UDID" \
            -destination-timeout 60 -derivedDataPath native/ios/build/DerivedData \
            -resultBundlePath "$SMOKE_OUTPUT_DIR/NativeSmoke.xcresult" \
            -only-testing:OrunVocaUITests/RuntimeSmokeTests/testOnlineLaunchWithoutNotebookOrTabs \
            -only-testing:OrunVocaUITests/RuntimeSmokeTests/testPronunciationBridgeNativeCompletion \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test-without-building \
            2>&1 | tee "$SMOKE_OUTPUT_DIR/ui-tests.log"
      - name: Export per-device XCTest screenshots and final simulator state
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_OUTPUT_DIR"
          # Nonessential evidence only: CoreSimulator list can hang after a good boot.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const output = process.env.SMOKE_OUTPUT_DIR + '/final-booted-state.json';
          try {
            fs.writeFileSync(output, execFileSync('xcrun', ['simctl', 'list', 'devices', 'booted', '--json'],
              { timeout: 10000, killSignal: 'SIGKILL', encoding: 'utf8' }));
          } catch (error) {
            console.warn('Nonfatal final-state diagnostic: ' + error);
            fs.writeFileSync(output + '.error.log', String(error));
          }
          JS
          echo "Environment: GitHub-hosted macOS VM running iOS Simulator ($SMOKE_DEVICE_FAMILY). Not a physical device." \
            > "$SMOKE_OUTPUT_DIR/ENVIRONMENT.txt"
          if [ -d "$SMOKE_OUTPUT_DIR/NativeSmoke.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$SMOKE_OUTPUT_DIR/NativeSmoke.xcresult" \
              --output-path "$SMOKE_OUTPUT_DIR/test-attachments" \
              2>&1 | tee "$SMOKE_OUTPUT_DIR/attachment-export.log"
          fi
      - name: Upload per-device screenshots logs app and XCTest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrunVoca-runtime-smoke-${{ matrix.device }}
          path: runtime-smoke/${{ matrix.device }}/
          if-no-files-found: error
          retention-days: 14
