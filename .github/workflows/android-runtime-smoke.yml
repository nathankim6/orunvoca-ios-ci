name: Android runtime smoke
# Android Emulator on a GitHub-hosted Linux VM. NOT a physical device and NOT a release:
# builds an unsigned debug APK only. Never signs, uploads or publishes anything.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Emulator runtime (API 34, Play image)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unit tests and unsigned debug build
        working-directory: native/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Launch, splash, login page, Google hand-off, unsolicited callback, offline state
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash native/android/scripts/runtime-smoke.sh
      - name: Upload screenshots, UI dumps and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrunVoca-android-runtime-smoke
          path: runtime-smoke/android/
          if-no-files-found: warn
          retention-days: 14
